name: Temporary tagged module checksum validation
on:
  push:
    branches: [release/fluxlog-goconfig-v1.7.0-migration]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/goconfig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: adapters/goconfig/go.mod
      - name: Resolve official release through Go
        run: |
          go list -m -json github.com/majiddarvishan/goconfig@v1.7.0
          go mod tidy
          printf '%s\n' '=== V1.7.0 CHECKSUMS ==='
          grep -F 'github.com/majiddarvishan/goconfig v1.7.0 ' go.sum
          grep -F 'github.com/majiddarvishan/goconfig v1.7.0/go.mod ' go.sum
          printf '%s\n' '=== MODULE DIFF ==='
          git diff -- go.mod go.sum
